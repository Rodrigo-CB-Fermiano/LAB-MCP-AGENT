[project]
name = "lab-mcp-2"
version = "0.1.0"
description = "Lab MCP Server - FullCycle"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]",
    "pydantic",
    "python-dotenv",
]

[project.scripts]
serve = "src.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
